# Butler Portal Helm values
# https://github.com/butlerdotdev/butler-portal

replicaCount: 1

# Extra annotations merged into the deployment pod template. Chart 0.5.3+
# already adds checksum/dynamic-plugins when dynamicPlugins.enabled is
# true; use this for hashes of any postRenderer-mounted ConfigMaps the
# chart doesn't own, so operators can drive their own rollout-on-change
# behavior without re-touching the chart.
podAnnotations: {}

image:
  repository: ghcr.io/butlerdotdev/butler-portal
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

service:
  type: ClusterIP
  port: 7007

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: portal.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: "2"
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}

# Backstage app-config overrides
# These are injected as environment variables into the portal pod
appConfig:
  # Base URL for the portal (frontend + backend)
  baseUrl: http://localhost:7007
  # Auth provider (guest for dev, configure OIDC for production)
  auth:
    provider: guest

# Service-account credentials for authenticating to butler-server.
# REQUIRED when plugins.butler.enabled is true: chart install/upgrade fails
# if Butler is enabled and butlerAuth.existingSecret is unset. When Butler
# is off (the chart default) the BUTLER_SERVICE_ACCOUNT_* env vars are not
# rendered into the Deployment and no Secret is consulted.
#
# Create the Secret in the release namespace before installing:
#
#   kubectl create secret generic butler-server-auth \
#     --namespace <release-namespace> \
#     --from-literal=username='<service-account-username>' \
#     --from-literal=password='<service-account-password>'
#
butlerAuth:
  # Name of an existing Secret in the release namespace holding the
  # butler-server service-account credentials. Must be set explicitly.
  existingSecret: ""
  # Key inside the Secret that holds the username.
  usernameKey: username
  # Key inside the Secret that holds the password.
  passwordKey: password

# Stage 2 portal-JWT signing key (optional). When set, butler-portal mints
# short-lived Ed25519 proofs and uses them as the outgoing Authorization
# Bearer in calls to butler-server; the legacy X-Butler-User-Email
# impersonation header is omitted on those calls. butler-server must have
# the matching public key configured via BUTLER_PORTAL_PUBKEY before this
# is activated in production; mounting the key Secret without the matching
# pubkey on the server side will cause requests to be rejected.
#
# Leave butlerSigning.existingSecret empty (the default) to keep the
# legacy carrier byte-identical. The chart does not require this field.
butlerSigning:
  # Name of an existing Secret in the release namespace holding the
  # Ed25519 private key in PEM (PKCS#8) form. The Secret is mounted as a
  # file at /etc/butler-portal/signing-key/key and read by PortalSigner
  # at plugin init.
  existingSecret: ""
  # Key inside the Secret that holds the PEM bytes. Default "key".
  keyKey: key
  # kid the portal stamps on every proof's JWT header. Must match the kid
  # under which butler-server has the public key configured (the kid PEM
  # header set when the public key was provisioned). Required when
  # existingSecret is set.
  kid: ""

# PostgreSQL via CloudNativePG
# Requires the CNPG operator to be installed in the cluster
postgresql:
  enabled: true
  # CNPG Cluster resource configuration
  instances: 1
  storage:
    size: 10Gi
    storageClass: ""
  walStorage:
    enabled: false
    size: 2Gi
    storageClass: ""
  # Database and owner created via initdb bootstrap
  database: butler_portal
  owner: butler_portal
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  # Optional Barman-backed backup configuration. Set enabled=true and
  # supply barmanObjectStore + a Secret for s3Credentials to activate.
  # The block is passed through to CNPG Cluster.spec.backup verbatim so
  # the full CNPG backup surface (endpointURL, server-side encryption,
  # per-data compression jobs, scheduled vs continuous) is available
  # without each new CNPG field requiring a chart bump.
  #
  # Example:
  #   backup:
  #     enabled: true
  #     retentionPolicy: "30d"
  #     target: prefer-standby
  #     barmanObjectStore:
  #       destinationPath: s3://my-bucket/butler-portal-prd
  #       endpointURL: https://s3.example.com
  #       s3Credentials:
  #         accessKeyId:
  #           name: butler-portal-backup-s3
  #           key: ACCESS_KEY_ID
  #         secretAccessKey:
  #           name: butler-portal-backup-s3
  #           key: SECRET_ACCESS_KEY
  #       wal:
  #         compression: gzip
  #       data:
  #         compression: gzip
  #         jobs: 2
  backup:
    enabled: false
    retentionPolicy: ""
    target: ""
    barmanObjectStore: {}

# Registry configuration
registry:
  # Base URL for the registry (e.g. https://portal.butlerlabs.dev)
  baseUrl: ""
  # GitHub token secret reference for repository_dispatch and commit status
  github:
    # Name of the K8s Secret containing the GitHub PAT
    secretName: ""
    # Key within the Secret
    secretKey: "token"

# Extra environment variables to add to the deployment
extraEnv: []
# - name: AUTH_GOOGLE_CLIENT_ID
#   valueFrom:
#     secretKeyRef:
#       name: google-auth
#       key: clientId

# Per-plugin runtime enable/disable. Mirrors the app-config schema at
# plugins.<name>.enabled. Defaults OFF for all Butler-Labs-branded plugins:
# external customers who install butler-portal without overriding these get
# the stock Backstage IDP shell (catalog, scaffolder, TechDocs, search) with
# no Butler Labs surface. Butler Labs' own deployment overrides all four to
# true in its HelmRelease.
#
# Toggling a plugin from false to true on a running install requires a rolling
# restart of the portal pod (env-var change), which Helm handles via the
# standard Deployment update.
#
# Plugin -> Butler Labs sidebar name mapping:
#   butler     -> Butler
#   workspaces -> Chambers
#   registry   -> Keeper
#   pipeline   -> Herald
#
# Note: workspaces (Chambers) is a frontend-only plugin that proxies butler-server
# through the butler-backend. Chambers depends on Butler at runtime; enabling
# plugins.workspaces.enabled without plugins.butler.enabled renders a branded
# "Chambers requires Butler" page on the Chambers route instead of letting the
# UI silently 404 against the absent /api/butler/* backend.
plugins:
  butler:
    enabled: false
  workspaces:
    enabled: false
  registry:
    enabled: false
  pipeline:
    enabled: false

# Customer-installed dynamic plugins (chart 0.5.0+). Enable to let the
# init container pull customer-built frontend+backend plugins at pod
# start into a shared volume the backend reads at boot. Default OFF:
# chart 0.5.0 with this block default renders byte-identical to chart
# 0.4.0's pod template (proven by tests/dynamic-plugins-disabled_test.yaml).
# Customers bumping from 0.4.0 to 0.5.0 do not roll their pods until
# they opt in.
#
# Open-product model -- the OPERATOR decides what plugins to enable.
# Nothing in this path is license-checked: a customer can ship any
# Backstage plugin in their own OCI registry, reference it here, and it
# loads at the same lifecycle a built-in plugin gets. Butler Labs ships
# the software fully open; this block lets operators extend their portal
# without forking the Butler Labs source.
#
# Security:
# - integrity: sha512:<hex> on every plugin entry is MANDATORY. The
#   installer skips entries without it and skips entries whose pulled
#   tarball does not match.
# - allowedSources is enforced from day one: plugin sources not matching
#   any prefix in the list are rejected. Chart 0.5.4+ default is the
#   curated marketplace set (RHDH community export + butlerdotdev first-
#   party). Operators extend the list with their own private registries.
#   Setting allowedSources: [] explicitly restores pre-0.5.4 permissive
#   behavior -- documented opt-out, not recommended for production.
# - continueOnError defaults to false: on any pull/integrity failure
#   the init container exits non-zero and the pod does not start.
#   Operators see the failure immediately rather than discovering a
#   plugin silently missing. Flip to true per cluster for partial-load
#   resilience.
dynamicPlugins:
  enabled: false
  installer:
    image: ghcr.io/butlerdotdev/butler-portal-plugin-installer
    tag: "0.1.1"
    pullPolicy: IfNotPresent
    # When any plugin fails to pull or fails integrity verification:
    # false = init container exits non-zero, pod does not start
    # true  = init container exits 0, the failed plugin is absent at boot
    continueOnError: false
  # Allowlist of permitted source prefixes for plugin packages. Chart 0.5.4+
  # default is the curated marketplace set: the upstream RHDH community plugin
  # export (third-party Backstage plugins repackaged as dynamic artifacts --
  # GitLab/GitHub catalog discovery, scaffolder modules, frontend cards) and
  # the butlerdotdev namespace (Butler Labs first-party plugins). Operators
  # extend the list to add their own internal registries.
  #
  # Override examples (operator-side):
  #   allowedSources:
  #     - oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays  # keep RHDH marketplace
  #     - oci://ghcr.io/butlerdotdev                                    # keep first-party
  #     - oci://my-corp-registry.example.com/butler-portal              # add internal
  #     - https://plugins.internal.example.com/                         # add tgz host
  #
  # Set to [] explicitly to opt back into the pre-0.5.4 permissive default
  # (any source the operator references is accepted) -- not recommended for
  # production.
  allowedSources:
    - oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays
    - oci://ghcr.io/butlerdotdev
  # Plugins to install. Each entry is one customer plugin OCI artifact
  # (frontend MF chunks + backend bundle) plus the pluginConfig that
  # registers its UI in the portal shell.
  #
  # Example:
  #   plugins:
  #     - package: oci://ghcr.io/customer/butler-tempo-plugin:1.0.0
  #       integrity: sha512:abc123...
  #       pluginConfig:
  #         dynamicPlugins:
  #           frontend:
  #             customer.butler-tempo-plugin:
  #               dynamicRoutes:
  #                 - path: /tempo
  #                   importName: TempoPage
  #                   menuItem: { text: Tempo }
  plugins: []
