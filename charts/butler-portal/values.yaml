# Butler Portal Helm values
# https://github.com/butlerdotdev/butler-portal

replicaCount: 1

image:
  repository: ghcr.io/butlerdotdev/butler-portal
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

service:
  type: ClusterIP
  port: 7007

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: portal.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: "2"
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}

# Backstage app-config overrides
# These are injected as environment variables into the portal pod
appConfig:
  # Base URL for the portal (frontend + backend)
  baseUrl: http://localhost:7007
  # Auth provider (guest for dev, configure OIDC for production)
  auth:
    provider: guest

# Service-account credentials for authenticating to butler-server.
# REQUIRED: chart install/upgrade fails if butlerAuth.existingSecret is unset.
#
# Create the Secret in the release namespace before installing:
#
#   kubectl create secret generic butler-server-auth \
#     --namespace <release-namespace> \
#     --from-literal=username='<service-account-username>' \
#     --from-literal=password='<service-account-password>'
#
butlerAuth:
  # Name of an existing Secret in the release namespace holding the
  # butler-server service-account credentials. Must be set explicitly.
  existingSecret: ""
  # Key inside the Secret that holds the username.
  usernameKey: username
  # Key inside the Secret that holds the password.
  passwordKey: password

# Stage 2 portal-JWT signing key (optional). When set, butler-portal mints
# short-lived Ed25519 proofs and uses them as the outgoing Authorization
# Bearer in calls to butler-server; the legacy X-Butler-User-Email
# impersonation header is omitted on those calls. butler-server must have
# the matching public key configured via BUTLER_PORTAL_PUBKEY before this
# is activated in production; mounting the key Secret without the matching
# pubkey on the server side will cause requests to be rejected.
#
# Leave butlerSigning.existingSecret empty (the default) to keep the
# legacy carrier byte-identical. The chart does not require this field.
butlerSigning:
  # Name of an existing Secret in the release namespace holding the
  # Ed25519 private key in PEM (PKCS#8) form. The Secret is mounted as a
  # file at /etc/butler-portal/signing-key/key and read by PortalSigner
  # at plugin init.
  existingSecret: ""
  # Key inside the Secret that holds the PEM bytes. Default "key".
  keyKey: key
  # kid the portal stamps on every proof's JWT header. Must match the kid
  # under which butler-server has the public key configured (the kid PEM
  # header set when the public key was provisioned). Required when
  # existingSecret is set.
  kid: ""

# PostgreSQL via CloudNativePG
# Requires the CNPG operator to be installed in the cluster
postgresql:
  enabled: true
  # CNPG Cluster resource configuration
  instances: 1
  storage:
    size: 10Gi
    storageClass: ""
  walStorage:
    enabled: false
    size: 2Gi
    storageClass: ""
  # Database and owner created via initdb bootstrap
  database: butler_portal
  owner: butler_portal
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

# Registry configuration
registry:
  # Base URL for the registry (e.g. https://portal.butlerlabs.dev)
  baseUrl: ""
  # GitHub token secret reference for repository_dispatch and commit status
  github:
    # Name of the K8s Secret containing the GitHub PAT
    secretName: ""
    # Key within the Secret
    secretKey: "token"

# Extra environment variables to add to the deployment
extraEnv: []
# - name: AUTH_GOOGLE_CLIENT_ID
#   valueFrom:
#     secretKeyRef:
#       name: google-auth
#       key: clientId
