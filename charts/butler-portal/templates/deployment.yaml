apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "butler-portal.fullname" . }}
  labels:
    {{- include "butler-portal.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "butler-portal.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "butler-portal.selectorLabels" . | nindent 8 }}
      {{- /*
        Pod-template annotations. The whole `annotations:` block is gated
        on having content so the disabled-state contract (pod template
        byte-identical to chart 0.4.0) is preserved when both
        dynamicPlugins and podAnnotations are off.

        - checksum/dynamic-plugins: hash of the rendered dynamic-plugins
          ConfigMap. A plugin version or integrity hash change rotates
          this value, the pod template changes, the rollout fires.
          Replaces the chart 0.5.0-0.5.2 manual `kubectl rollout restart
          deploy butler-portal` step that operators had to remember
          after every plugin bump.
        - podAnnotations: operator-supplied passthrough for any other
          checksums or annotations the chart doesn't own (e.g. a hash
          of a postRenderer-mounted app-config ConfigMap).
      */}}
      {{- $podAnnotations := dict }}
      {{- if .Values.dynamicPlugins.enabled }}
        {{- $cm := include (print $.Template.BasePath "/dynamic-plugins-configmap.yaml") . | sha256sum }}
        {{- $podAnnotations = merge $podAnnotations (dict "checksum/dynamic-plugins" $cm) }}
      {{- end }}
      {{- with .Values.podAnnotations }}
        {{- $podAnnotations = merge $podAnnotations . }}
      {{- end }}
      {{- if $podAnnotations }}
      annotations:
        {{- toYaml $podAnnotations | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "butler-portal.serviceAccountName" . }}
      {{- if .Values.butlerSigning.existingSecret }}
      securityContext:
        # The backstage container runs as the node user (UID 1000, GID 1000)
        # per packages/backend/Dockerfile. fsGroup sets the mounted Secret
        # file's group ownership to 1000 and joins the container's
        # supplementary groups, so a 0440 mode grants read via the group bit
        # without exposing the private key to other UIDs on the node.
        fsGroup: 1000
      {{- end }}
      {{- if .Values.dynamicPlugins.enabled }}
      initContainers:
        # install-dynamic-plugins (chart 0.5.0+). Pulls customer-installed
        # plugins listed in dynamicPlugins.plugins[] into the shared volume
        # the backend reads at boot. Integrity-verified (sha512, mandatory,
        # fail-closed). Allowlist-enforced when dynamicPlugins.allowedSources
        # is set; permissive when unset. continueOnError gates whether a pull
        # failure crashes the pod (false, default) or boots without the
        # failed plugin (true).
        - name: install-dynamic-plugins
          image: "{{ .Values.dynamicPlugins.installer.image }}:{{ .Values.dynamicPlugins.installer.tag }}"
          imagePullPolicy: {{ .Values.dynamicPlugins.installer.pullPolicy }}
          env:
            - name: CONTINUE_ON_ERROR
              value: {{ .Values.dynamicPlugins.installer.continueOnError | quote }}
          volumeMounts:
            - name: dynamic-plugins-config
              mountPath: /etc/butler-portal
              readOnly: true
            - name: dynamic-plugins
              # Chart 0.5.2 path correction: the installer hardcodes
              # /dynamic-plugins-root as the destination it mkdirs and
              # writes into. Chart 0.5.0-0.5.1 mounted the volume at
              # /opt/butler-portal/dynamic-plugins (the install-time
              # mkdir failed because nothing was writable at the
              # default path). Matching the chart to the installer's
              # default path avoids requiring an installer release just
              # to thread the path through.
              mountPath: /dynamic-plugins-root
      {{- end }}
      containers:
        - name: backstage
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 7007
              protocol: TCP
          env:
            - name: APP_CONFIG_app_baseUrl
              value: {{ .Values.appConfig.baseUrl | quote }}
            - name: APP_CONFIG_backend_baseUrl
              value: {{ .Values.appConfig.baseUrl | quote }}
            {{- if .Values.postgresql.enabled }}
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ include "butler-portal.dbSecretName" . }}
                  key: host
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ include "butler-portal.dbSecretName" . }}
                  key: port
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "butler-portal.dbSecretName" . }}
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "butler-portal.dbSecretName" . }}
                  key: password
            {{- end }}
            - name: REGISTRY_BASE_URL
              value: {{ .Values.registry.baseUrl | quote }}
            {{- if .Values.registry.github.secretName }}
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.registry.github.secretName }}
                  key: {{ .Values.registry.github.secretKey | default "token" }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            # Per-plugin runtime gates. Backstage parses APP_CONFIG_* values as
            # JSON; the literal strings "true" / "false" map to JSON booleans.
            # Positioned after extraEnv so chart-managed values win over any
            # user extraEnv override. Each value goes through default false
            # so a partial values override (plugins: {} or plugins.butler set
            # but plugins.workspaces left nil) renders "false" instead of "",
            # which JSON.parse would reject and crash the backend at startup.
            #
            # Go template's `if` treats non-empty strings as truthy, so a
            # values override that passes plugins.X.enabled: "false" (string)
            # would render the value as "false" but ALSO trigger the
            # butlerAuth Secret gate. Normalise by stringifying and
            # comparing to the literal "true" so only a real true (boolean
            # or "true" string) activates Butler.
            {{- $plugins := default (dict) .Values.plugins }}
            {{- $butler := default (dict) $plugins.butler }}
            {{- $workspaces := default (dict) $plugins.workspaces }}
            {{- $registry := default (dict) $plugins.registry }}
            {{- $pipeline := default (dict) $plugins.pipeline }}
            {{- $butlerEnabled := eq (toString (default false $butler.enabled)) "true" }}
            - name: APP_CONFIG_plugins_butler_enabled
              value: {{ default false $butler.enabled | quote }}
            - name: APP_CONFIG_plugins_workspaces_enabled
              value: {{ default false $workspaces.enabled | quote }}
            - name: APP_CONFIG_plugins_registry_enabled
              value: {{ default false $registry.enabled | quote }}
            - name: APP_CONFIG_plugins_pipeline_enabled
              value: {{ default false $pipeline.enabled | quote }}
            {{- if $butlerEnabled }}
            # Service-account credentials for butler-server. Only rendered
            # when plugins.butler.enabled is true: an external customer who
            # leaves Butler off has no reason to provision a dead Secret.
            # Positioned last so the chart-managed secretKeyRef wins over
            # any extraEnv override.
            - name: BUTLER_SERVICE_ACCOUNT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ required "butlerAuth.existingSecret is required when plugins.butler.enabled is true. Create a Secret in the release namespace with username and password keys for the butler-server service account, then set butlerAuth.existingSecret to its name. See chart README for details." .Values.butlerAuth.existingSecret }}
                  key: {{ .Values.butlerAuth.usernameKey | default "username" }}
            - name: BUTLER_SERVICE_ACCOUNT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.butlerAuth.existingSecret }}
                  key: {{ .Values.butlerAuth.passwordKey | default "password" }}
            {{- end }}
            {{- if .Values.butlerSigning.existingSecret }}
            # Stage 2 portal-JWT signer config. When butlerSigning is set,
            # the backend mounts the Ed25519 private key as a file (below)
            # and reads it via butler.signing.keyPath; the kid is plumbed
            # via env so PortalSigner stamps each proof correctly. With
            # butlerSigning unset, neither env is exported and PortalSigner
            # stays dormant; the legacy admin Bearer carrier runs unchanged.
            - name: BUTLER_SIGNING_KEY_PATH
              value: /etc/butler-portal/signing-key/key
            - name: BUTLER_SIGNING_KID
              value: {{ required "butlerSigning.kid is required when butlerSigning.existingSecret is set; see chart README for details." .Values.butlerSigning.kid | quote }}
            {{- end }}
            {{- if .Values.dynamicPlugins.enabled }}
            # Customer-installed dynamic plugins (chart 0.5.0+). The backend's
            # dynamicPluginsFeatureLoader reads from this directory at boot
            # and registers backend features it finds. The init container
            # above populates the directory before the backend starts.
            - name: APP_CONFIG_dynamicPlugins_rootDirectory
              # Chart 0.5.2: matched to the installer's hardcoded write
              # destination so the backend's plugin scanner reads from
              # the same volume the installer populated. See the
              # init-container volumeMount comment above.
              value: /dynamic-plugins-root
            - name: APP_CONFIG_dynamicPlugins_continueOnError
              value: {{ .Values.dynamicPlugins.installer.continueOnError | quote }}
            # @backstage/backend-dynamic-feature-service's plugin scanner
            # resolves a dynamic plugin's backstage module imports against
            # NODE_PATH. Without this the backend crashes at boot with
            # "Dynamic plugins under '/dynamic-plugins-root' cannot access
            # backstage modules in '/app/node_modules'. Please add
            # '/app/node_modules' to the 'NODE_PATH' when running the
            # backstage backend." (chart 0.5.1; gated on dynamicPlugins
            # so the disabled-state pod env is byte-identical to chart
            # 0.4.0.)
            - name: NODE_PATH
              value: /app/node_modules
            {{- end }}
          {{- if or .Values.butlerSigning.existingSecret .Values.dynamicPlugins.enabled }}
          volumeMounts:
            {{- if .Values.butlerSigning.existingSecret }}
            - name: butler-signing-key
              mountPath: /etc/butler-portal/signing-key
              readOnly: true
            {{- end }}
            {{- if .Values.dynamicPlugins.enabled }}
            - name: dynamic-plugins
              # Chart 0.5.2: same volume, matched to the installer's
              # hardcoded write path. The backend container mounts it
              # read-only.
              mountPath: /dynamic-plugins-root
              readOnly: true
            {{- end }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if or .Values.butlerSigning.existingSecret .Values.dynamicPlugins.enabled }}
      volumes:
        {{- if .Values.butlerSigning.existingSecret }}
        - name: butler-signing-key
          secret:
            secretName: {{ .Values.butlerSigning.existingSecret }}
            # 0440 + fsGroup 1000 (set on the PodSpec above): owner root reads,
            # group 1000 reads, others get nothing. The container's node user
            # (UID 1000) joins GID 1000 via fsGroup and reads via the group
            # bit. 0400 would require root and the container is non-root.
            defaultMode: 0440
            items:
              - key: {{ .Values.butlerSigning.keyKey | default "key" }}
                path: key
        {{- end }}
        {{- if .Values.dynamicPlugins.enabled }}
        - name: dynamic-plugins
          emptyDir: {}
        - name: dynamic-plugins-config
          configMap:
            name: {{ include "butler-portal.fullname" . }}-dynamic-plugins
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
