name: docs compile-check

on:
  pull_request:
    paths:
      - "docs/plugin-authoring/**/*.md"
      - "docs/architecture/**/*.md"
      - "examples/adopter-plugin/**"
      - "scripts/docs-compile-check.mjs"
      - ".github/workflows/docs-compile-check.yml"
  push:
    branches:
      - main
    paths:
      - "docs/plugin-authoring/**/*.md"
      - "docs/architecture/**/*.md"
      - "examples/adopter-plugin/**"
      - "scripts/docs-compile-check.mjs"
      - ".github/workflows/docs-compile-check.yml"

jobs:
  compile-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Extract fenced blocks and compile
        run: node scripts/docs-compile-check.mjs

      # The adopter-plugin reference is the "runnable reference" the docs
      # point at as ground truth. Both install and compile are enforced;
      # the reference is the docs' claim, and a claim that does not
      # build is worse than the doc bug the reference was meant to
      # solve. The .npmrc in examples/adopter-plugin/backend/ pins
      # legacy-peer-deps=true so npm accepts the @backstage/cli@0.36.4
      # jsdom peer conflict the same way yarn (used everywhere else in
      # the repo) already does.
      - name: Install adopter-plugin reference deps
        working-directory: examples/adopter-plugin/backend
        run: npm install --no-audit --no-fund
      - name: Compile adopter-plugin reference
        working-directory: examples/adopter-plugin/backend
        run: npx tsc --noEmit
