app:
  title: Butler Portal
  baseUrl: http://localhost:3000

organization:
  name: Butler Labs

backend:
  baseUrl: http://localhost:7007
  listen:
    port: 7007
  csp:
    connect-src: ["'self'", 'http:', 'https:', 'ws:', 'wss:']
  cors:
    origin: http://localhost:3000
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  database:
    client: better-sqlite3
    connection: ':memory:'
  # Auth policy enforced -- management API requires Backstage auth.
  # Protocol endpoints (Terraform, Helm, OCI, webhooks) remain unauthenticated.

permission:
  enabled: true

auth:
  environment: development
  providers:
    # Guest is the default sign-in affordance. Identity providers are opt-in:
    # wire the provider's auth.providers.<key> subtree (see docs/reference
    # "Authentication and Authorization") and its sign-in card + backend route
    # appear together. Example for Google:
    #   google:
    #     development:
    #       clientId: ${AUTH_GOOGLE_CLIENT_ID}
    #       clientSecret: ${AUTH_GOOGLE_CLIENT_SECRET}
    #       prompt: select_account
    guest: {}

integrations:
  github:
    - host: github.com
      token: ${GITHUB_TOKEN}

catalog:
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration
  rules:
    - allow: [Component, System, API, Resource, Location, Template, Group, User, Domain]
  locations: []

techdocs:
  builder: 'local'
  generator:
    runIn: 'local'
  publisher:
    type: 'local'

scaffolder:
  defaultAuthor:
    name: Butler Portal
    email: butler-portal@butlerlabs.dev

# Per-plugin runtime enable/disable. Default OFF for all Butler-Labs-branded
# plugins so external customer deployments fail safe: a deployment without
# overrides gets the stock Backstage IDP shell (catalog, scaffolder, TechDocs,
# search) with no Butler Labs surface. Butler Labs' own deployment overrides
# these to true in its HelmRelease (clusters/butler-portal/apps/butler-portal/
# helmrelease.yaml). The per-plugin config blocks below (butler, registry,
# pipeline) are only read when their plugin is enabled.
plugins:
  butler:
    enabled: false
  workspaces:
    enabled: false
  registry:
    enabled: false
  pipeline:
    enabled: false

butler:
  # Local dev fallback to localhost:8080 is intentional; pointed at a wrong
  # server, the portal will fail visibly on the first request to butler-server.
  baseUrl: ${BUTLER_SERVER_URL:-http://localhost:8080}
  # No fallback. Set BUTLER_SERVICE_ACCOUNT_USER and BUTLER_SERVICE_ACCOUNT_PASSWORD
  # via the chart-managed Secret (butlerAuth.existingSecret), via an app-config
  # local override during development, or via an environment variable. The plugin
  # rejects empty values and the literal "admin" at init time.
  auth:
    username: ${BUTLER_SERVICE_ACCOUNT_USER}
    password: ${BUTLER_SERVICE_ACCOUNT_PASSWORD}
  # Stage 2 portal-JWT signing config. Both fields are optional: when
  # unset the legacy admin Bearer + X-Butler-User-Email carrier is used.
  # When both are set AND the key file at keyPath exists, the plugin
  # constructs a PortalSigner that mints proofs replacing the legacy
  # Authorization on calls to butler-server. The chart sets these envs
  # only when butlerSigning.existingSecret is configured.
  signing:
    kid: ${BUTLER_SIGNING_KID:-}
    keyPath: ${BUTLER_SIGNING_KEY_PATH:-}

pipeline:
  vectorBinaryPath: vector
  vrl:
    timeoutMs: 5000
    maxInputEvents: 100

search:
  collators:
    catalog:
      schedule:
        frequency: { minutes: 10 }
        timeout: { minutes: 5 }
