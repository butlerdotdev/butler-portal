app:
  title: Butler Portal
  baseUrl: http://localhost:3000

organization:
  name: Butler Labs

backend:
  baseUrl: http://localhost:7007
  listen:
    port: 7007
  csp:
    connect-src: ["'self'", 'http:', 'https:', 'ws:', 'wss:']
  cors:
    origin: http://localhost:3000
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  database:
    client: better-sqlite3
    connection: ':memory:'
  # Auth policy enforced — management API requires Backstage auth.
  # Protocol endpoints (Terraform, Helm, OCI, webhooks) remain unauthenticated.

permission:
  enabled: true

auth:
  environment: development
  providers:
    guest: {}
    google:
      development:
        clientId: ${AUTH_GOOGLE_CLIENT_ID}
        clientSecret: ${AUTH_GOOGLE_CLIENT_SECRET}
        prompt: select_account

integrations:
  github:
    - host: github.com
      token: ${GITHUB_TOKEN}

catalog:
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration
  rules:
    - allow: [Component, System, API, Resource, Location, Template, Group, User, Domain]
  locations: []

techdocs:
  builder: 'local'
  generator:
    runIn: 'local'
  publisher:
    type: 'local'

scaffolder:
  defaultAuthor:
    name: Butler Portal
    email: butler-portal@butlerlabs.dev

butler:
  # Local dev fallback to localhost:8080 is intentional; pointed at a wrong
  # server, the portal will fail visibly on the first request to butler-server.
  baseUrl: ${BUTLER_SERVER_URL:-http://localhost:8080}
  # No fallback. Set BUTLER_SERVICE_ACCOUNT_USER and BUTLER_SERVICE_ACCOUNT_PASSWORD
  # via the chart-managed Secret (butlerAuth.existingSecret), via an app-config
  # local override during development, or via an environment variable. The plugin
  # rejects empty values and the literal "admin" at init time.
  auth:
    username: ${BUTLER_SERVICE_ACCOUNT_USER}
    password: ${BUTLER_SERVICE_ACCOUNT_PASSWORD}

pipeline:
  vectorBinaryPath: vector
  vrl:
    timeoutMs: 5000
    maxInputEvents: 100

search:
  collators:
    catalog:
      schedule:
        frequency: { minutes: 10 }
        timeout: { minutes: 5 }
